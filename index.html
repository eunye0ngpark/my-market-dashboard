<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f0e">
  <meta name="description" content="MY MARKET 每日金融情报：全球指数、板块趋势、关键资讯与自选股行情看板。">
  <title>MY MARKET · 每日金融情报</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l2.5-7 5 14 2.5-7h4"/></symbol>
    <symbol id="i-news" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M7 8h10M7 12h10M7 16h6"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 8a7 7 0 0 1 11.7-1L20 12M4 12l2.2 5a7 7 0 0 0 11.7-1"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/></symbol>
  </svg>

  <aside class="sidebar" aria-label="主导航">
    <a class="brand" href="#overview" aria-label="MY MARKET 首页">
      <span class="brand-symbol">M<span></span></span>
      <span><strong>MY MARKET</strong><small>MARKET INTELLIGENCE</small></span>
    </a>
    <nav class="side-nav">
      <p class="nav-label">工作台</p>
      <button class="nav-link active" data-nav="overview"><svg><use href="#i-grid"/></svg><span>市场总览</span><i></i></button>
      <button class="nav-link" data-nav="signals"><svg><use href="#i-pulse"/></svg><span>多空信号</span><i></i></button>
      <button class="nav-link" data-nav="news"><svg><use href="#i-news"/></svg><span>关键资讯</span><b id="nav-news-count">6</b></button>
      <button class="nav-link" data-nav="watchlist"><svg><use href="#i-star"/></svg><span>我的自选</span><i></i></button>
      <p class="nav-label nav-label-second">市场</p>
      <button class="nav-link" data-market-link="中国"><svg><use href="#i-globe"/></svg><span>中国市场</span></button>
      <button class="nav-link" data-market-link="美国"><svg><use href="#i-globe"/></svg><span>美国市场</span></button>
      <button class="nav-link" data-market-link="行业"><svg><use href="#i-sliders"/></svg><span>行业板块</span></button>
    </nav>
    <div class="sidebar-footer">
      <span class="status-dot"></span>
      <div><strong>数据服务已就绪</strong><small>公开行情 · 延迟数据</small></div>
      <button aria-label="通知"><svg><use href="#i-bell"/></svg></button>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <a class="mobile-brand" href="#overview"><span class="brand-symbol">M<span></span></span><strong>MY MARKET</strong></a>
      <button class="global-search" data-action="open-search"><svg><use href="#i-search"/></svg><span>搜索股票、指数或基金</span><kbd>⌘ K</kbd></button>
      <div class="topbar-right">
        <div class="market-clock"><span class="status-dot"></span><span id="market-status">全球市场追踪中</span></div>
        <button class="refresh-button" data-action="refresh"><svg><use href="#i-refresh"/></svg><span>更新最新信息</span></button>
      </div>
    </header>

    <main id="app" class="dashboard" aria-live="polite">
      <div class="page-loading"><span class="loader"></span><p>正在准备市场看板…</p></div>
    </main>
    <footer class="footer"><span>MY MARKET FINANCIAL INTELLIGENCE</span><p>数据仅供参考，不构成任何投资建议。市场有风险，决策需谨慎。</p><span id="footer-year"></span></footer>
  </div>

  <nav class="mobile-nav" aria-label="移动端导航">
    <button class="active" data-nav="overview"><svg><use href="#i-grid"/></svg><span>总览</span></button>
    <button data-nav="signals"><svg><use href="#i-pulse"/></svg><span>信号</span></button>
    <button data-nav="news"><svg><use href="#i-news"/></svg><span>资讯</span></button>
    <button data-nav="watchlist"><svg><use href="#i-star"/></svg><span>自选</span></button>
  </nav>

  <dialog id="search-modal" class="modal search-modal">
    <div class="modal-search-row"><svg><use href="#i-search"/></svg><input id="stock-search" type="search" autocomplete="off" placeholder="输入中文名称或代码，如 拼多多 / PDD / 腾讯" aria-label="搜索股票"><button class="icon-button" data-action="close-search" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
    <div id="search-results" class="search-results"></div>
    <div class="modal-hint"><span><kbd>↑</kbd><kbd>↓</kbd> 浏览</span><span><kbd>ESC</kbd> 关闭</span><span>支持中文名称、美股、港股及 A 股代码</span></div>
  </dialog>

  <dialog id="stock-modal" class="modal stock-modal"><div id="stock-detail"></div></dialog>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
